[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlctl"
version = "0.1.0"
description = "CLI tool for bundling selected functions from local Python packages"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]

[project.scripts]
dlctl = "dlctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dlctl"]
