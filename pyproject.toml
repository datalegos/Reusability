[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dl-reuse-demo"
version = "1.0.0"
description = "Small demo package for the dlctl bundle POC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dl_reuse_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
